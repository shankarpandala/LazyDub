[package]
name = "maata"
version = "0.1.0"
description = "Maata — YouTube in Telugu, on your Mac"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Keep compiler plugins loadable on macOS (rust-lang/rust#157750).
# The shipped executable still uses the release settings above.
[profile.release.build-override]
strip = "none"
