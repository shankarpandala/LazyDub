<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maata</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0a0910; color: #f5f2ec; font: 14px -apple-system, system-ui, sans-serif; }
  body { display: grid; place-items: center; overflow: hidden; }
  .glow { position: fixed; width: 60vw; height: 60vw; border-radius: 50%; filter: blur(90px); opacity: .45;
          background: radial-gradient(circle, rgba(242,96,60,.55), transparent 65%); animation: breathe 3s ease-in-out infinite alternate; }
  .box { position: relative; text-align: center; }
  .mark { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 22px; display: grid; place-items: center; font-size: 30px; font-weight: 700; color: #1a0f08;
          background: linear-gradient(120deg, #f7b733, #f2603c 52%, #d8336b); box-shadow: 0 10px 50px rgba(242,96,60,.5); }
  .msg { color: #b7b0c4; }
  .err { color: #ffb4b4; max-width: 460px; margin-top: 8px; display: none; }
  .bar { width: 160px; height: 3px; margin: 18px auto 0; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar div { width: 40%; height: 100%; background: linear-gradient(90deg, #f7b733, #f2603c); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @keyframes breathe { to { transform: scale(1.08); opacity: .6; } }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="box">
    <div class="mark">మా</div>
    <div class="msg">Starting the on-device engine…</div>
    <div class="bar"><div></div></div>
    <div class="err" id="err"></div>
  </div>
  <script>
    window.maataSplashError = (m) => {
      const e = document.getElementById("err");
      e.textContent = m; e.style.display = "block";
      document.querySelector(".bar").style.display = "none";
      document.querySelector(".msg").textContent = "The engine couldn't start";
    };
  </script>
</body>
</html>
