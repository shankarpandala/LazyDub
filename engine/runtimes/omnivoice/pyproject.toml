[project]
name = "maata-omnivoice-evaluation"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "omnivoice @ git+https://github.com/k2-fsa/OmniVoice.git@08be0b4ccbac3e13e374e86fbfead4b4cac343e2",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "transformers==5.3.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
torch = { index = "pypi-mac" }
torchaudio = { index = "pypi-mac" }

[[tool.uv.index]]
name = "pypi-mac"
url = "https://pypi.org/simple"
explicit = true
